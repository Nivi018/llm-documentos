[project]
name = "llm-documentos-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx2>=2.16,<3",
    "pydantic>=2,<3",
    "pypdf>=7,<8",
    "python-docx>=1.2,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
