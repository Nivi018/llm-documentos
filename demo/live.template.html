<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>LLM Documentos · Demo en acción</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b171b; color: #effaf5; font-family: system-ui, sans-serif; }
    #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b171b; }
    header, footer { position: absolute; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; }
    header { top: 9px; height: 34px; font-size: 21px; font-weight: 650; }
    header span, footer { color: #afe1cd; font: 14px Consolas, monospace; }
    header span { letter-spacing: .06em; }
    video { position: absolute; top: 48px; left: 80px; width: 1120px; height: 630px; background: #fff; }
    footer { bottom: 11px; }
    .progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; transform-origin: left; background: #8eeac4; }
  </style>
</head>
<body>
  <main id="stage" data-composition-id="llm-flujo" data-start="0" data-duration="__DURATION__" data-width="1280" data-height="720">
    <header>LLM Documentos <span>FLUJO REAL AUTOMATIZADO CON PLAYWRIGHT</span></header>
    <video id="grabacion-playwright" class="clip" src="assets/flujo.webm" data-start="0" data-duration="__DURATION__" data-track-index="0" muted playsinline></video>
    <footer><span>PDF FICTICIO · MODO SIMULADO · SIN CORTES</span><span>github.com/Nivi018/llm-documentos</span></footer>
    <div class="progress"></div>
  </main>
  <script>
    const timeline = gsap.timeline({ paused: true });
    timeline.fromTo(".progress", { scaleX: 0 }, { scaleX: 1, duration: __DURATION__, ease: "none" }, 0);
    window.__timelines = { "llm-flujo": timeline };
  </script>
</body>
</html>
